<text x="425.0" y="345.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Validate format, network and merchant</text>
<polyline points="425.0,386 425.0,427" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,427 420.0,417 430.0,417" fill="#64748b"/>
