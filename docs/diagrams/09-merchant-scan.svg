<polyline points="425.0,821 425.0,862" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,862 420.0,852 430.0,852" fill="#64748b"/>
<polygon points="425.0,870 780,918.0 425.0,966 70,918.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
