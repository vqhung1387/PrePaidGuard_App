<text x="425.0" y="490.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Refresh eligibility and preview payment</text>
<polyline points="425.0,531 425.0,572" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,572 420.0,562 430.0,562" fill="#64748b"/>
<rect x="70" y="580" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="635.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Merchant signs checkInWithSignature</text>
<polyline points="425.0,676 425.0,717" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,717 420.0,707 430.0,707" fill="#64748b"/>
