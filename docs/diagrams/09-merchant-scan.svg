<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1340" viewBox="0 0 1280 1340" role="img">
<title>Scan and release payment</title>
<desc>Merchant pays gas; Vault verifies the signed authorization</desc>
<rect width="1280" height="1340" fill="#f8fafc"/>
<text x="45" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#0f172a">Scan and release payment</text>
<text x="45" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#475569">Merchant pays gas; Vault verifies the signed authorization</text>
<rect x="70" y="145" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
