<text x="1060.0" y="911.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">Revert atomically; no state</text>
<text x="1060.0" y="936.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">or payout change</text>
