<polygon points="425.0,1007 420.0,997 430.0,997" fill="#64748b"/>
<text x="455.0" y="989" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Yes</text>
