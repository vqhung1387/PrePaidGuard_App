<text x="425.0" y="1070.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Update principal, period and nonce; pay recipients</text>
<polyline points="425.0,1111 425.0,1152" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,1152 420.0,1142 430.0,1142" fill="#64748b"/>
<rect x="70" y="1160" width="710" height="96" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="425.0" y="1215.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Confirm receipt; sync both devices</text>
<text x="45" y="1317" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748b">PrePaidGuard | Design draft | Read policy B1-B6 in project.md</text>
</svg>