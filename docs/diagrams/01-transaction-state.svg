<polyline points="425.0,531 425.0,572" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,572 420.0,562 430.0,562" fill="#64748b"/>
<text x="455.0" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Yes</text>
