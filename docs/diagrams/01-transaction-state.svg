<text x="1060.0" y="488.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">Rejected: return to idle</text>
<polyline points="780,483.0 902,483.0" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round"/>
