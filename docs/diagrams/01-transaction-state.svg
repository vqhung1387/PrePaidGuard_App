<text x="845.0" y="474.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#be123c">No</text>
<rect x="70" y="580" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="635.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Broadcast and save transaction hash</text>
<polyline points="425.0,676 425.0,717" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
