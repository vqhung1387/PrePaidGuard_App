<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1195" viewBox="0 0 1280 1195" role="img">
<title>Transaction states</title>
<desc>Only a verified receipt confirms a payment</desc>
<rect width="1280" height="1195" fill="#f8fafc"/>
<text x="45" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#0f172a">Transaction states</text>
<text x="45" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#475569">Only a verified receipt confirms a payment</text>
<rect x="70" y="145" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="200.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">User requests a transaction</text>
<polyline points="425.0,241 425.0,282" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
