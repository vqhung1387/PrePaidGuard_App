<polyline points="425.0,966 425.0,1007" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,1007 420.0,997 430.0,997" fill="#64748b"/>
<text x="455.0" y="989" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Yes</text>
<rect x="910" y="870" width="300" height="96" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1060.0" y="923.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">Reverted: no financial event</text>
<polyline points="780,918.0 902,918.0" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round"/>
<polygon points="902,918.0 892,913.0 892,923.0" fill="#e11d48"/>
<text x="845.0" y="909.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#be123c">No</text>
<rect x="70" y="1015" width="710" height="96" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="425.0" y="1070.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Confirmed: refresh chain state</text>
<text x="45" y="1172" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748b">PrePaidGuard | Design draft | Read policy B1-B6 in project.md</text>
