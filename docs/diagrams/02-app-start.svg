<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050" role="img">
<title>App startup</title>
<desc>Check configuration before enabling transactions</desc>
<rect width="1280" height="1050" fill="#f8fafc"/>
<text x="45" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#0f172a">App startup</text>
<text x="45" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#475569">Check configuration before enabling transactions</text>
<rect x="70" y="145" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="200.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Start Flutter and load local deployment</text>
<polyline points="425.0,241 425.0,282" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,282 420.0,272 430.0,272" fill="#64748b"/>
<rect x="70" y="290" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="345.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">GET /config</text>
<polyline points="425.0,386 425.0,427" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,427 420.0,417 430.0,417" fill="#64748b"/>
<polygon points="425.0,435 780,483.0 425.0,531 70,483.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="425.0" y="490.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Chain, Vault and ABI match?</text>
<polyline points="425.0,531 425.0,572" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,572 420.0,562 430.0,562" fill="#64748b"/>
<text x="455.0" y="554" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Yes</text>
<rect x="910" y="435" width="300" height="96" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1060.0" y="476.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">Block actions; fix</text>
<text x="1060.0" y="501.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">configuration</text>
<polyline points="780,483.0 902,483.0" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round"/>
<polygon points="902,483.0 892,478.0 892,488.0" fill="#e11d48"/>
<text x="845.0" y="474.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#be123c">No</text>
<rect x="70" y="580" width="710" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="635.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Restore token and GET /me</text>
<polyline points="425.0,676 425.0,717" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,717 420.0,707 430.0,707" fill="#64748b"/>
<polygon points="425.0,725 780,773.0 425.0,821 70,773.0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="425.0" y="780.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Session valid?</text>
<polyline points="425.0,821 425.0,862" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
<polygon points="425.0,862 420.0,852 430.0,852" fill="#64748b"/>
<text x="455.0" y="844" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#475569">Yes</text>
<rect x="910" y="725" width="300" height="96" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="1060.0" y="778.5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a">Connect wallet and sign in</text>
<polyline points="780,773.0 902,773.0" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round"/>
<polygon points="902,773.0 892,768.0 892,778.0" fill="#e11d48"/>
<text x="845.0" y="764.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#be123c">No</text>
<rect x="70" y="870" width="710" height="96" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="425.0" y="925.5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#0f172a">Open subscriber / merchant home</text>
<text x="45" y="1027" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748b">PrePaidGuard | Design draft | Read policy B1-B6 in project.md</text>
</svg>