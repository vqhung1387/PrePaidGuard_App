name: Backend checks

on:
  push:
    branches: [backend, main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prepaidguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/prepaidguard_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/prepaidguard_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked pytest -q
      - run: docker build -f backend/Dockerfile -t prepaidguard-backend:ci .
        working-directory: .
      - name: Start backend container
        run: |
          docker run -d --name prepaidguard-ci --network host \
            -e DATABASE_URL -e PORT=8089 prepaidguard-backend:ci
          trap 'docker rm -f prepaidguard-ci >/dev/null' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 --max-time 5 \
            --fail --silent --show-error http://127.0.0.1:8089/health ||
            { docker logs prepaidguard-ci; exit 1; }
