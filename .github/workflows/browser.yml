name: Browser acceptance

on:
  push:
    branches: [main, frontend, backend, solidity, "feat/**", "fix/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prepaidguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/prepaidguard_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npm run build
        working-directory: contracts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter_app
      - run: flutter build web --no-pub --dart-define=CHAIN_ID=31337 --dart-define=API_BASE_URL=http://127.0.0.1:18010
        working-directory: apps/flutter_app
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked --with playwright==1.65.2 playwright install --with-deps chromium
      - run: uv run --locked --with playwright==1.65.2 python ../scripts/browser_acceptance/local.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: validation-results/browser/browser

